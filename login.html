<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصتي التعليمية</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .navbar {
      gap: 10px;
      flex-wrap: wrap;
    }
    #authBtn {
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <strong>منصتي التعليمية</strong>
    <a id="authBtn" href="login.html" class="btn" style="padding: 6px 12px; font-size: 0.9rem;">دخول الطلاب</a>
  </header>

  <section class="hero">
    <h1 id="heroTitle">أهلاً بك في منصتي التعليمية</h1>
    <p>شروحات مبسطة وتدريبات منظمة خطوة بخطوة.</p>
  </section>

  <main class="container">
    <h2 style="margin-bottom: 15px;">الكورسات المتاحة</h2>

    <div class="card">
      <h3>الكورس الأول: أساسيات الشرح والمراجعة</h3>
      <p>شرح شامل لأهم النقاط بأسلوب مبسط.</p>
      <a href="course.html?id=1" class="btn">دخول الكورس</a>
    </div>

    <div class="card">
      <h3>الكورس الثاني: تدريبات وحل أسئلة</h3>
      <p>نماذج امتحانات وتطبيق عملي على الدروس.</p>
      <a href="course.html?id=2" class="btn">دخول الكورس</a>
    </div>
  </main>

  <script>
    const studentName = localStorage.getItem("studentName");
    if (studentName) {
      document.getElementById("heroTitle").textContent = `أهلاً بك يا ${studentName} في منصتي التعليمية`;
      document.getElementById("authBtn").textContent = `حسابي (${studentName})`;
    }
  </script>

</body>
</html>
