<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشاهدة الدرس - منصتي التعليمية</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #f1f5f9; color: #1e293b; line-height: 1.6; }
    .navbar { background: #0f172a; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .btn { display: inline-block; background: #2563eb; color: #fff; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: bold; }
    .video-box { position: relative; padding-bottom: 56.25%; height: 0; margin: 20px 0; background: #000; border-radius: 12px; overflow: hidden; }
    .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    .theme-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 15px; padding: 10px; background: #f8fafc; border-radius: 10px; border: 1px solid #e2e8f0; }
    .theme-btn { border: none; padding: 7px 14px; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; }
    .c-blue { background: #2563eb; }
    .c-green { background: #059669; }
    .c-purple { background: #7c3aed; }
    .c-orange { background: #d97706; }

    body.t-green .navbar { background: #064e3b; }
    body.t-green .btn { background: #059669; }
    body.t-purple .navbar { background: #4c1d95; }
    body.t-purple .btn { background: #7c3aed; }
    body.t-orange .navbar { background: #78350f; }
    body.t-orange .btn { background: #d97706; }
  </style>
</head>
<body>

  <header class="navbar">
    <strong>منصتي التعليمية</strong>
    <a href="index.html" class="btn" style="padding: 6px 12px; font-size: 0.9rem;">العودة للكورسات</a>
  </header>

  <main class="container">
    <div class="card">
      <div class="theme-bar">
        <span><strong>اختر لون الصفحة:</strong></span>
        <button type="button" class="theme-btn c-blue" onclick="setTheme('')">أزرق</button>
        <button type="button" class="theme-btn c-green" onclick="setTheme('t-green')">أخضر</button>
        <button type="button" class="theme-btn c-purple" onclick="setTheme('t-purple')">بنفسجي</button>
        <button type="button" class="theme-btn c-orange" onclick="setTheme('t-orange')">برتقالي</button>
      </div>

      <h1 id="lessonTitle" style="margin-bottom: 8px;">عنوان الدرس</h1>
      <p id="lessonDesc" style="color: #475569;">تفاصيل الشرح...</p>

      <div class="video-box">
        <iframe id="lessonVideo" src="" frameborder="0" allowfullscreen></iframe>
      </div>

      <a href="quiz.html" class="btn">ابدأ اختبار الدرس</a>
    </div>
  </main>

  <script>
    const lessons = {
      1: {
        title: "الكورس الأول: أساسيات الشرح والمراجعة",
        desc: "شرح شامل لأهم النقاط بأسلوب مبسط مع أمثلة توضيحية.",
        video: "https://www.youtube.com/embed/dQw4w9WgXcQ"
      },
      2: {
        title: "الكورس الثاني: تدريبات وحل أسئلة",
        desc: "نماذج امتحانات وتطبيق عملي على الدروس خطوة بخطوة.",
        video: "https://www.youtube.com/embed/dQw4w9WgXcQ"
      }
    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id") || "1";
    const lesson = lessons[id] || lessons["1"];

    document.getElementById("lessonTitle").textContent = lesson.title;
    document.getElementById("lessonDesc").textContent = lesson.desc;
    document.getElementById("lessonVideo").src = lesson.video;

    function setTheme(name) {
      document.body.className = name;
      localStorage.setItem("courseTheme", name);
    }

    const saved = localStorage.getItem("courseTheme");
    if (saved) setTheme(saved);
  </script>

</body>
</html>
