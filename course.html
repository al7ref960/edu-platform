<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل الكورس - منصتي التعليمية</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <strong>منصتي التعليمية</strong>
    <div class="nav-actions">
      <span id="studentBadge"></span>
      <button type="button" id="logoutBtn" class="btn btn-logout hidden">تسجيل خروج</button>
      <button type="button" id="menuToggle" class="menu-btn hidden" aria-expanded="false" aria-controls="mobileMenu">القائمة</button>
    </div>
  </header>

  <nav id="mobileMenu" aria-label="القائمة الجانبية">
    <a href="index.html">الرئيسية</a>
    <a href="course.html?id=1">مبادئ القانون</a>
    <a href="course.html?id=2">مبادئ الاقتصاد</a>
    <a href="course.html?id=3">لغة أجنبية</a>
    <a href="course.html?id=4">مبادئ المحاسبة المالية</a>
    <a href="course.html?id=5">مبادئ إدارة الأعمال</a>
  </nav>

  <main class="container">
    <div id="lockedBox" class="card hidden">
      <h2>يلزم تسجيل الدخول أولاً</h2>
      <p>للوصول إلى محتوى الكورس، يرجى تسجيل الدخول من الصفحة الرئيسية بكود صحيح.</p>
      <a href="index.html" class="btn">الذهاب لتسجيل الدخول</a>
    </div>

    <div id="courseBox" class="card hidden">
      <h1 id="courseTitle"></h1>
      <p id="courseDesc"></p>
      <hr>
      <h3>محتوى الكورس</h3>
      <p id="courseOutline"></p>
      <div class="quick-actions">
        <a href="index.html" class="btn btn-secondary">العودة للرئيسية</a>
      </div>
    </div>
  </main>

  <script>
    const coursesData = {
      "1": {
        title: "مبادئ القانون",
        desc: "شرح مبسط للقواعد القانونية الأساسية وتطبيقاتها العملية.",
        outline: "الوحدة الأولى: تعريف القاعدة القانونية وخصائصها. الوحدة الثانية: مصادر القانون وتدرجها. الوحدة الثالثة: الأشخاص والحقوق والالتزامات."
      },
      "2": {
        title: "مبادئ الاقتصاد",
        desc: "فهم أساسيات العرض والطلب والنشاط الاقتصادي والموارد.",
        outline: "الوحدة الأولى: المشكلة الاقتصادية والموارد النادرة. الوحدة الثانية: العرض والطلب وتوازن السوق. الوحدة الثالثة: الأسواق والنشاط الاقتصادي العام."
      },
      "3": {
        title: "لغة أجنبية",
        desc: "تنمية مهارات القراءة والمفردات والقواعد الأساسية.",
        outline: "الوحدة الأولى: المصطلحات الأساسية ومفردات الحياة اليومية. الوحدة الثانية: تكوين الجمل والقواعد الضرورية. الوحدة الثالثة: قراءة النصوص وفهم المعنى العام."
      },
      "4": {
        title: "مبادئ المحاسبة المالية",
        desc: "أساسيات القيود المحاسبية والقوائم المالية وتوازن الحسابات.",
        outline: "الوحدة الأولى: المعادلة المحاسبية والحسابات. الوحدة الثانية: دفتر اليومية والقيود المحاسبية. الوحدة الثالثة: ميزان المراجعة والقوائم المالية الأساسية."
      },
      "5": {
        title: "مبادئ إدارة الأعمال",
        desc: "مفاهيم التخطيط والتنظيم والتوجيه والرقابة في المنظمات.",
        outline: "الوحدة الأولى: ماهية الإدارة وأهميتها. الوحدة الثانية: التخطيط والتنظيم واتخاذ القرار. الوحدة الثالثة: التوجيه والرقابة وإدارة فرق العمل."
      }
    };

    const lockedBox = document.getElementById("lockedBox");
    const courseBox = document.getElementById("courseBox");
    const courseTitle = document.getElementById("courseTitle");
    const courseDesc = document.getElementById("courseDesc");
    const courseOutline = document.getElementById("courseOutline");
    const studentBadge = document.getElementById("studentBadge");
    const logoutBtn = document.getElementById("logoutBtn");
    const menuToggle = document.getElementById("menuToggle");
    const mobileMenu = document.getElementById("mobileMenu");

    function isValidCode(code) {
      const clean = code.trim().toUpperCase();
      const match = clean.match(/^([A-Z]{1,3})-?(\d{1,5})$/);
      if (!match) return false;
      const num = parseInt(match[2], 10);
      return num >= 1 && num <= 50000;
    }

    function initCoursePage() {
      const savedName = localStorage.getItem("studentName");
      const savedCode = localStorage.getItem("studentCode");
      const isLoggedIn = localStorage.getItem("studentAccess") === "granted";

      if (!savedName || !savedCode || !isValidCode(savedCode) || !isLoggedIn) {
        lockedBox.classList.remove("hidden");
        courseBox.classList.add("hidden");
        logoutBtn.classList.add("hidden");
        menuToggle.classList.add("hidden");
        studentBadge.textContent = "";
        return;
      }

      lockedBox.classList.add("hidden");
      courseBox.classList.remove("hidden");
      logoutBtn.classList.remove("hidden");
      menuToggle.classList.remove("hidden");
      studentBadge.textContent = "أهلاً، " + savedName;

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id") || "1";
      const course = coursesData[id] || coursesData["1"];

      document.title = course.title + " - منصتي التعليمية";
      courseTitle.textContent = course.title;
      courseDesc.textContent = course.desc;
      courseOutline.textContent = course.outline;
    }

    logoutBtn.addEventListener("click", function () {
      localStorage.removeItem("studentAccess");
      window.location.href = "index.html";
    });

    menuToggle.addEventListener("click", function () {
      const isOpen = mobileMenu.classList.toggle("open");
      menuToggle.setAttribute("aria-expanded", String(isOpen));
    });

    initCoursePage();
  </script>

</body>
</html>
