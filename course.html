<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المادة الدراسية — منصة الحريف — البشمندس بوده</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      position: relative;
      min-height: 100vh;
    }

    .watermark {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-18deg);
      font-size: clamp(2.2rem, 7vw, 5.2rem);
      font-weight: bold;
      color: rgba(37, 99, 235, 0.06);
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }

    .navbar,
    .container,
    .owner-footer {
      position: relative;
      z-index: 1;
    }

    .navbar {
      background-color: #1e3a8a;
      color: #ffffff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 14px;
    }

    .card {
      background-color: rgba(255, 255, 255, 0.96);
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.06);
    }

    h1, h2, h3, h4 {
      color: #1e3a8a;
      margin-top: 0;
    }

    label {
      display: block;
      margin: 10px 0 6px;
      font-weight: bold;
      color: #1e3a8a;
    }

    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #93c5fd;
      border-radius: 8px;
      font-size: 0.95rem;
      background-color: #ffffff;
      font-family: inherit;
    }

    textarea {
      min-height: 95px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: 2px solid #2563eb;
      border-color: #2563eb;
    }

    .btn,
    a.btn,
    button.btn {
      display: inline-block;
      background-color: #2563eb;
      color: #ffffff;
      border: 1px solid #2563eb;
      border-radius: 8px;
      padding: 9px 15px;
      font-size: 0.92rem;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .btn:hover,
    a.btn:hover,
    button.btn:hover {
      background-color: #1d4ed8;
      border-color: #1d4ed8;
    }

    .btn-secondary {
      background-color: #3b82f6;
      border-color: #3b82f6;
    }

    .btn-danger {
      background-color: #dc2626;
      border-color: #dc2626;
    }

    .btn-danger:hover {
      background-color: #b91c1c;
      border-color: #b91c1c;
    }

    .btn-sm {
      padding: 7px 12px;
      font-size: 0.85rem;
    }

    .lesson-list {
      list-style: none;
      padding: 0;
      margin: 12px 0 0;
    }

    .lesson-item {
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .lesson-item strong {
      color: #1e3a8a;
      display: block;
      margin-bottom: 6px;
      font-size: 1rem;
    }

    .video-box {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      margin-top: 12px;
      border-radius: 10px;
      overflow: hidden;
      background-color: #0f172a;
      border: 1px solid #93c5fd;
    }

    .video-box iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

      padding: 10px 12px;
      border-radius: 8px;
