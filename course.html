<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل الكورس</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <strong>منصتي التعليمية</strong>
    <div class="nav-actions">
      <a href="index.html" class="btn">الرئيسية</a>
      <a href="login.html" id="authBtn" class="btn">دخول الطلاب</a>
    </div>
  </header>

  <section class="hero">
    <h1 id="courseTitle">تفاصيل الكورس</h1>
    <p id="courseSubtitle">محتوى تدريبي منظم ومبسط.</p>
  </section>

  <main class="container">
    <div class="card">
      <h3 id="lessonHeading">محتوى الدرس</h3>
      <p id="courseContent">جاري تحميل محتوى الكورس...</p>
      <a href="index.html" class="btn">العودة للكورسات</a>
    </div>
  </main>

  <script>
    const authBtn = document.getElementById("authBtn");
    const studentName = localStorage.getItem("studentName");
    if (studentName && studentName.trim() !== "") {
      authBtn.textContent = "أهلاً، " + studentName.trim();
    }

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    const titleEl = document.getElementById("courseTitle");
    const subtitleEl = document.getElementById("courseSubtitle");
    const headingEl = document.getElementById("lessonHeading");
    const contentEl = document.getElementById("courseContent");

    if (id === "1") {
      titleEl.textContent = "الكورس الأول: أساسيات الشرح والمراجعة";
      subtitleEl.textContent = "شرح شامل لأهم النقاط بأسلوب مبسط.";
      headingEl.textContent = "أهداف الكورس الأول";
      contentEl.textContent = "في هذا الكورس ستتعرف على المفاهيم الأساسية وتراجع أهم النقاط بخطوات واضحة ومباشرة.";
    } else if (id === "2") {
      titleEl.textContent = "الكورس الثاني: تطبيقات عملية وحل تدريبات";
      subtitleEl.textContent = "تدريبات عملية وأسئلة متنوعة لتثبيت المعلومات.";
      headingEl.textContent = "محتوى التدريبات العملية";
      contentEl.textContent = "في هذا الكورس ستطبق ما تعلمته عملياً من خلال أمثلة وتدريبات متدرجة في الصعوبة.";
    } else {
      titleEl.textContent = "الكورس غير محدد";
      subtitleEl.textContent = "اختر كورساً من الصفحة الرئيسية لعرض تفاصيله.";
      headingEl.textContent = "تنبيه";
      contentEl.textContent = "لم يتم اختيار رقم كورس صالح. يمكنك الرجوع إلى الصفحة الرئيسية واختيار الكورس المطلوب.";
    }
  </script>

</body>
</html>
